<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1317">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Chain-Up Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-height app, 3D yard on the left, instructor panel on the right; stacks on phones. Night chain-up area, hi-vis amber. */
:root{
  --bg:#0e1317; --panel:#161d23; --panel2:#1c252c; --line:#2a353e;
  --fg:#e9eef1; --muted:#97a5af; --amber:#f2b705; --amber-ink:#1a1400;
  --good:#4cc38a; --bad:#ef6a5a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--amber);display:grid;place-items:center}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}
.tab{font:600 14px var(--body);color:var(--muted);background:none;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--amber);color:var(--amber-ink)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0}
#stage{position:relative;border-radius:10px;overflow:hidden;background:#1b252d;min-height:320px;border:1px solid var(--line)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:rgba(14,19,23,.85);color:var(--fg);font:700 22px var(--body);cursor:pointer;display:grid;place-items:center}
.zoom button:hover{border-color:var(--amber)}
.zoom button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.zoom #z-fit{font-size:11px;font-weight:600;letter-spacing:.04em}
.hint-chip{position:absolute;left:12px;top:12px;font-size:12px;color:var(--muted);background:rgba(14,19,23,.8);border:1px solid var(--line);border-radius:999px;padding:5px 10px;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font:600 12px var(--body);padding:4px 8px;border-radius:4px;transform:translate(-50%,-140%);white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.panel h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px}
.counter{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.counter b{font-family:var(--display);font-size:36px;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px var(--body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.fb strong{font-family:var(--display);font-size:20px;letter-spacing:.02em}
.fb.good{border-color:var(--good)} .fb.good strong{color:var(--good)}
.fb.bad{border-color:var(--bad)} .fb.bad strong{color:var(--bad)}
.fb p{color:var(--fg)}
.legend{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--amber)} .progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)}
ol.done{margin:0;padding-left:22px;display:grid;gap:4px;font-size:14px}
ol.done li::marker{color:var(--good);font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:500 14px/1.35 var(--body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer}
.opt:hover{border-color:var(--amber)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.steps li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.steps .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.steps li.ok{color:var(--fg)} .steps li.ok .n{background:var(--good);border-color:var(--good);color:#06150d}
.steps li.now{color:var(--amber);font-weight:600} .steps li.now .n{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.steps li span:last-child{padding-top:2px}
.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px}
.seg-b{flex:1;font:600 13px var(--body);color:var(--muted);background:none;border:0;border-radius:6px;padding:8px 6px;cursor:pointer}
.seg-b[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.seg-b:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.why{color:var(--fg)!important}
.fine{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
@media (max-width:860px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  #stage{height:54vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.axle-diag{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;margin-top:8px}
.diag-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid transparent}
.diag-row.need-row{background:rgba(76,195,138,.12);border-color:rgba(76,195,138,.35)}
.diag-axle{font-family:monospace;font-size:14px;letter-spacing:1px}
.dt{padding:2px 3px;border-radius:4px}
.dt.need{background:var(--amber);color:var(--amber-ink);font-weight:700}
.diag-note{font-size:12px;color:var(--muted);margin-top:2px}
.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ref-card{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left}
.ref-card.active{border-color:var(--amber)}
.ref-card b{font-family:var(--display);font-size:16px}
.ref-card span{font-size:12px;color:var(--muted);line-height:1.3}
.ref-card .ref-need{color:var(--amber);font-weight:600}
.ref-details{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ref-details summary{cursor:pointer;font-weight:600;color:var(--fg);font-size:13px}
@media (max-width:860px){.ref-grid{grid-template-columns:1fr}}

</style>
<style>body{margin:0}
.axle-diag{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;margin-top:8px}
.diag-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;border:1px solid transparent}

.dt{padding:2px 3px;border-radius:4px}
.dt.need{background:var(--amber);color:var(--amber-ink);font-weight:700}

.ref-card b{font-family:var(--display);font-size:16px}

</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1a1400" stroke-width="2.4"><rect x="2" y="7" width="7" height="6" rx="3"/><rect x="11" y="7" width="7" height="6" rx="3"/></svg>
      </div>
      <h1>Chain-Up Trainer</h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-tires" role="tab" aria-selected="true">Which Tires</button>
      <button class="tab" id="tab-install" role="tab" aria-selected="false">Install Steps</button>
    </div>
  </header>
  <div class="main">
    <div id="stage">
      <div class="hint-chip" id="chip">Drag to look around · + / − to zoom · tap a tire to chain it</div>
      <div id="tip" hidden></div>
      <div class="zoom">
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-out" aria-label="Zoom out">&minus;</button>
        <button id="z-fit" aria-label="Reset view">RESET</button>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const stage=document.getElementById('stage'), panel=document.getElementById('panel'), tip=document.getElementById('tip'), chip=document.getElementById('chip');
const FT=0.3048, TW=102*0.0254, TOP=13.5*FT, TL=53*FT, R=0.505, WY=0.51;

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9b8c6);
scene.fog=new THREE.Fog(0xa9b8c6,60,170);
const camera=new THREE.PerspectiveCamera(40,1,0.1,400);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.47; controls.minDistance=2.2; controls.maxDistance=70;

scene.add(new THREE.HemisphereLight(0xdfeeff,0x4a4f55,0.7));
const sun=new THREE.DirectionalLight(0xfff2dd,1.4);
sun.position.set(18,30,22); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0004;
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:100});
scene.add(sun); scene.add(sun.target);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0xe3e9ed,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
function asphaltTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#4a4d50';g.fillRect(0,0,256,256);
  for(let i=0;i<4000;i++){const v=60+Math.random()*40|0;g.fillStyle='rgb('+v+','+v+','+(v+2)+')';g.fillRect(Math.random()*256,Math.random()*256,2,2);}
  for(let i=0;i<500;i++){g.fillStyle='rgba(235,240,244,.55)';g.fillRect(Math.random()*256,Math.random()*256,3,2);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.repeat.set(60,3);return t;
}
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,12),new THREE.MeshStandardMaterial({map:asphaltTex(),roughness:.95}));
road.rotation.x=-Math.PI/2; road.position.y=0.005; road.receiveShadow=true; scene.add(road);
for(const z of[-5.8,5.8]){const s=new THREE.Mesh(new THREE.PlaneGeometry(400,0.14),new THREE.MeshBasicMaterial({color:0xe8e2cf}));s.rotation.x=-Math.PI/2;s.position.set(0,0.01,z);scene.add(s);}

/* falling snow */
const flakeN=1600, flakePos=new Float32Array(flakeN*3);
for(let i=0;i<flakeN;i++){flakePos[i*3]=(Math.random()-.5)*80;flakePos[i*3+1]=Math.random()*24;flakePos[i*3+2]=(Math.random()-.5)*50;}
const flakeGeo=new THREE.BufferGeometry(); flakeGeo.setAttribute('position',new THREE.BufferAttribute(flakePos,3));
const flakes=new THREE.Points(flakeGeo,new THREE.PointsMaterial({color:0xffffff,size:0.09,transparent:true,opacity:.9}));
scene.add(flakes);

/* ---------- materials (from the Backup Semi Trailer truck) ---------- */
const M={
  paint:new THREE.MeshStandardMaterial({color:0xb3121b,metalness:0.45,roughness:0.32}),
  chrome:new THREE.MeshStandardMaterial({color:0xdde3e8,metalness:1,roughness:0.15}),
  alum:new THREE.MeshStandardMaterial({color:0xc4c9cd,metalness:0.8,roughness:0.35}),
  black:new THREE.MeshStandardMaterial({color:0x151617,roughness:0.6,metalness:0.2}),
  rubber:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.95}),
  frame:new THREE.MeshStandardMaterial({color:0x222426,roughness:0.7,metalness:0.4}),
  glass:new THREE.MeshStandardMaterial({color:0x1e2a33,metalness:0.6,roughness:0.08}),
  trailer:new THREE.MeshStandardMaterial({color:0xf3f4f2,roughness:0.5,metalness:0.15}),
  amber:new THREE.MeshStandardMaterial({color:0xffa31a,roughness:0.4}),
  red:new THREE.MeshStandardMaterial({color:0xc81414,roughness:0.4}),
  head:new THREE.MeshStandardMaterial({color:0xf4f6ff,roughness:0.2,metalness:0.3}),
  tapeR:new THREE.MeshStandardMaterial({color:0xd8211d,roughness:0.3,emissive:0x3a0000}),
  tapeW:new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,emissive:0x222222}),
  dump:new THREE.MeshStandardMaterial({color:0x8a9196,metalness:0.55,roughness:0.4}),
  gravel:new THREE.MeshStandardMaterial({color:0x5e564b,roughness:1}),
  chain:new THREE.MeshStandardMaterial({color:0xcfd5da,metalness:.6,roughness:.32,emissive:0x000000}),
  ghost:new THREE.MeshBasicMaterial({color:0xf2b705,transparent:true,opacity:.65}),
  hook:new THREE.MeshStandardMaterial({color:0x4cc38a,emissive:0x1f6b47}),
  tens:new THREE.MeshStandardMaterial({color:0xc0392b,roughness:.6}),
  post:new THREE.MeshStandardMaterial({color:0x7d858c,metalness:.4,roughness:.5}),
};
const postMat=new THREE.MeshStandardMaterial({color:0xd7dadb,roughness:0.45,metalness:0.4});
const doorMat=new THREE.MeshStandardMaterial({color:0xe9ebea,roughness:0.5,metalness:0.2});
const fenderMat=new THREE.MeshStandardMaterial({color:0x151617,roughness:0.6,side:THREE.DoubleSide});
const frontFender=M.paint.clone(); frontFender.side=THREE.DoubleSide;

function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(r,len,mat,x,y,z,axis,parent,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||24),mat);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function rod(p,a,b,r,m){const d=new THREE.Vector3().subVectors(b,a);const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);c.position.copy(a).addScaledVector(d,.5);c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());p.add(c);return c;}
function textPlane(lines,w,h,fg,bg,size){
  const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);
  const x=c.getContext('2d');
  if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);}
  x.fillStyle=fg;x.font='700 '+size+'px "Barlow Condensed", "Arial Narrow", sans-serif';x.textAlign='center';x.textBaseline='middle';
  lines.forEach((l,i)=>x.fillText(l,c.width/2,c.height/2+(i-(lines.length-1)/2)*size*1.05));
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:!bg,side:THREE.DoubleSide}));
}
function woodTex(){
  const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  for(let i=0;i<8;i++){const v=110+Math.random()*40|0;g.fillStyle='rgb('+v+','+(v*0.68|0)+','+(v*0.42|0)+')';g.fillRect(0,i*8,256,8);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,i*8+7,256,1);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;
}

/* chain-up area sign */
const sign=(function(){
  const g=new THREE.Group();
  cyl(0.07,3.2,M.post,-1.1,1.6,0,null,g); cyl(0.07,3.2,M.post,1.1,1.6,0,null,g);
  box(3.1,1.4,0.06,M.frame,0,3.4,0,g);
  const board=textPlane(['COMMERCIAL VEHICLES','CHAIN-UP AREA'],3,1.3,'#111','#f4f4f2',70);
  board.position.set(0,3.4,0.04); g.add(board);
  for(const sx of[-1.25,1.25]){const l=new THREE.Mesh(new THREE.SphereGeometry(0.14,16,12),new THREE.MeshBasicMaterial({color:0xffb000}));l.position.set(sx,4.3,0.05);l.userData.flash=true;g.add(l);}
  scene.add(g); return g;
})();

/* ---------- tires ---------- */
const tires=[]; let pickMeshes=[]; let driveCount=2; let regTires=true;
function tireChain(w,mat){
  const g=new THREE.Group();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const b=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.035,w+0.05),mat);b.position.set(Math.cos(a)*(R+0.014),Math.sin(a)*(R+0.014),0);b.rotation.z=a;g.add(b);}
  for(const s of[-1,1]){const t=new THREE.Mesh(new THREE.TorusGeometry(R-0.04,0.014,6,48),mat);t.position.z=s*(w/2+0.012);g.add(t);}
  return g;
}
function tireUnit(parent,x,z,w,outer,side,spins){
  const g=new THREE.Group(); g.position.set(x,WY,z); parent.add(g);
  const spin=new THREE.Group(); g.add(spin); if(spins) spins.push(spin);
  const mat=M.rubber.clone(); mat.emissive=new THREE.Color(0x000000);
  const tor=new THREE.Mesh(new THREE.TorusGeometry(0.39,0.13,14,36),mat); tor.scale.z=w/0.26; tor.castShadow=true; spin.add(tor);
  const tread=new THREE.Mesh(new THREE.CylinderGeometry(R,R,w,36,1,true),mat); tread.rotation.x=Math.PI/2; tread.castShadow=true; spin.add(tread);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.29,0.29,w-0.03,28),outer?M.alum:M.frame); rim.rotation.x=Math.PI/2; spin.add(rim);
  if(outer){
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,0.14,16),M.chrome); hub.rotation.x=Math.PI/2; hub.position.z=side*(w/2+0.005); spin.add(hub);
    for(let k=0;k<10;k++){const a=k/10*Math.PI*2;const n=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.05,6),M.chrome);n.rotation.x=Math.PI/2;n.position.set(Math.cos(a)*0.2,Math.sin(a)*0.2,side*(w/2-0.005));spin.add(n);}
  }
  return {g,spin,meshes:[tor,tread],mat};
}

/* ---------- install scene: the same tractor, chain on the driver-side front drive duals ---------- */
const inst=new THREE.Group(); scene.add(inst); inst.visible=false;
const instSpins=[];
regTires=false;
const instTractor=buildTractor({drives:2,tire:'dual',spins:instSpins});
regTires=true;
const instTruck=instTractor.g; inst.add(instTruck);
const DX=0.72;
const chainHolder=new THREE.Group(); chainHolder.position.set(DX,WY,0); chainHolder.scale.z=-1; instTruck.add(chainHolder);
const groundHolder=new THREE.Group(); inst.add(groundHolder);
const pivot={rotation:{set z(v){instSpins.forEach(s=>s.rotation.z=v);chainHolder.rotation.z=v;}}};
const ZI=TW/2-0.5-0.15, ZO=TW/2-0.2+0.15, ZC=(ZI+ZO)/2, ZW=ZO-ZI;
/* ---------- real link chains ---------- */
const LP=0.04;
const linkGeo=new THREE.TorusGeometry(0.0155,0.0052,6,14); linkGeo.scale(1.6,1,1);
const camMat=new THREE.MeshStandardMaterial({color:0xe2b21c,metalness:.4,roughness:.4});
const _X=new THREE.Vector3(1,0,0), _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _t=new THREE.Quaternion(), _s=new THREE.Vector3(1,1,1);
function linkSet(holder,cap){const im=new THREE.InstancedMesh(linkGeo,M.chain,cap);im.count=0;im.castShadow=true;holder.add(im);return im;}
function lay(im,pts){
  let k=0,carry=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],seg=b.clone().sub(a),L=seg.length();if(L<1e-6)continue;
    const d=seg.clone().divideScalar(L);
    for(let s=carry;s<L;s+=LP){
      if(im.count>=im.instanceMatrix.count) return;
      const p=a.clone().addScaledVector(d,s+LP/2>L?L-LP/2:s+LP/2);
      _q.setFromUnitVectors(_X,d);_t.setFromAxisAngle(d,(k%2)*Math.PI/2);_q.premultiply(_t);
      _m.compose(p,_q,_s);im.setMatrixAt(im.count++,_m);k++;
      carry=s+LP-L;
    }
    if(carry<0)carry=0;
  }
  im.instanceMatrix.needsUpdate=true;
}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function arc(z,r,a0,a1){const n=Math.max(2,Math.ceil(Math.abs(a1-a0)*r/0.015));const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push(V(Math.cos(a)*r,Math.sin(a)*r,z));}return p;}
const RS=R-0.035, RM=R-0.06, RT=R+0.013;
function sideChains(im,a0,a1,which){
  if(which.includes('i')) lay(im,arc(ZI,RS,a0,a1));
  if(which.includes('m')) lay(im,arc(ZC,RM,a0,a1));
  if(which.includes('o')) lay(im,arc(ZO,RS,a0,a1));
}
function crossChains(im,a0,a1){
  const step=2*Math.PI/16;
  for(let a=Math.ceil(a0/step)*step;a<=a1+1e-6;a+=step){
    const c=Math.cos(a),s=Math.sin(a),P=(r,z)=>V(c*r,s*r,z);
    lay(im,[P(RS,ZI),P(RT,ZI+0.035),P(RT,ZC-0.03),P(R-0.02,ZC),P(RT,ZC+0.03),P(RT,ZO-0.035),P(RS,ZO)]);
  }
}
function hangEnd(im,a,z,dir){
  const r=z===ZC?RM:RS,x=Math.cos(a)*r,y=Math.sin(a)*r,g=-WY+0.012;
  lay(im,[V(x,y,z),V(x+dir*0.03,g,z),V(x+dir*0.32,g,z)]);
}
function hookMesh(holder,a,z,mat){
  const h=new THREE.Mesh(new THREE.TorusGeometry(0.026,0.0065,6,14,Math.PI*1.35),mat);
  h.position.set(Math.cos(a)*RS,Math.sin(a)*RS,z);h.rotation.z=a+Math.PI/2;holder.add(h);return h;
}
function camLever(holder,a,z){
  const g=new THREE.Group();g.position.set(Math.cos(a)*RS,Math.sin(a)*RS,z);g.rotation.z=a+Math.PI/2;holder.add(g);
  const lev=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.022,0.016),camMat);lev.position.set(0.05,0.0,0.012);g.add(lev);
  const piv=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.03,10),M.chrome);piv.rotation.x=Math.PI/2;g.add(piv);
}
function tensioner(holder){
  const zf=ZO+0.06;
  const hub=new THREE.Mesh(new THREE.TorusGeometry(0.06,0.014,8,24),M.tens);hub.position.z=zf;holder.add(hub);
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2+0.25,e=V(Math.cos(a)*(RS-0.01),Math.sin(a)*(RS-0.01),ZO+0.015);
    rod(holder,V(Math.cos(a)*0.06,Math.sin(a)*0.06,zf),e,0.011,M.tens);
    const sh=new THREE.Mesh(new THREE.TorusGeometry(0.014,0.004,6,10,Math.PI*1.5),M.chrome);sh.position.copy(e);sh.rotation.z=a;holder.add(sh);
  }
}
const D=Math.PI/180;
function renderInstall(c){
  chainHolder.clear(); groundHolder.clear();
  if(c===1){
    const im=linkSet(groundHolder,400),pts=[];
    for(let i=0;i<=220;i++){const t=i/220,a=t*Math.PI*2*5.5,r=0.08+0.2*Math.abs(Math.sin(t*7.3))+0.06*Math.sin(a*1.7);pts.push(V(DX+1.5+Math.cos(a)*r,0.02+t*0.06,-2.0+Math.sin(a)*r));}
    lay(im,pts);
  }
  if(c===2){
    const im=linkSet(groundHolder,900),x0=DX+0.7,x1=DX+3.8,g=0.016;
    [ZI,ZC,ZO].forEach(z=>lay(im,[V(x0,g,-z),V(x1,g,-z)]));
    for(let x=x0+0.1;x<x1-0.05;x+=0.21) lay(im,[V(x,g+0.004,-ZI),V(x,g+0.004,-ZO)]);
    hookMesh(groundHolder,0,-ZI,M.chrome).position.set(x0-0.03,g,-ZI);
    const cl=new THREE.Group();groundHolder.add(cl);camLever(cl,0,0);cl.position.set(x0-0.04-RS,g,-ZO);
  }
  if(c>=3){
    const im=linkSet(chainHolder,1600);
    if(c===3){
      const a0=-25*D,a1=205*D;
      sideChains(im,a0,a1,'imo');crossChains(im,a0,a1);
      [ZI,ZC,ZO].forEach(z=>{hangEnd(im,a0,z,1);hangEnd(im,a1,z,-1);});
      hookMesh(chainHolder,a0,ZI,M.chrome);
    }else{
      sideChains(im,0,2*Math.PI,'im');crossChains(im,0,2*Math.PI-0.01);
      hookMesh(chainHolder,-38*D,ZI,M.hook);
      if(c===4){
        lay(im,arc(ZO,RS,-25*D,300*D));
        const e=300*D;lay(im,[V(Math.cos(e)*RS,Math.sin(e)*RS,ZO),V(Math.cos(e)*RS+0.02,-WY+0.015,ZO+0.02)]);
      }else{
        lay(im,arc(ZO,RS,0,2*Math.PI));
        camLever(chainHolder,-38*D,ZO);
        camLever(chainHolder,140*D,ZO);
      }
      if(c>=6) tensioner(chainHolder);
    }
  }
}

function getSets(s){
  return s.answers.map(fn=>tires.filter(t=>t.role==='drive'&&fn(t)));

function loadScenario(){

function chainedCount(){return tires.filter(t=>t.chained).length;}

function showCorrect(){

}
function showGhostOnly(){

function evaluate(){
  const s=SCEN[T.idx], ch=tires.filter(t=>t.chained), drive=ch.filter(t=>t.role==='drive'), other=ch.filter(t=>t.role!=='drive');
  const sets=getSets(s);
  const ok=other.length===0&&sets.some(a=>sameSet(a,drive));
  const expected=sets.find(a=>sameSet(a,drive))||sets[0];
  const probs=[];
  if(other.length) probs.push('You chained '+other.length+' steer or trailer tire'+(other.length>1?'s':'')+'. The required chains go on drive tires.');
  if(drive.length!==s.need) probs.push('You chained '+drive.length+' drive tire'+(drive.length===1?'':'s')+'. This rig needs '+s.need+'.');
  else if(!ok&&!other.length) probs.push('Right count, wrong spots. '+s.hint);
  tires.forEach(t=>{
    const exp=expected.includes(t);
    t.mat.emissive.setHex(t.chained?(exp&&t.role==='drive'?0x1f6b47:0x7a1f16):0x000000);
    t.ghostG.visible=exp&&!t.chained;
  });
  T.checked=true; T.results[T.idx]=ok; if(ok) T.score++;
  T.last={ok,probs,expected};
  renderTires();
}

function axleDiagramHTML(s, expected){
  // Build top-down ASCII diagram showing which tires need chains
  const isTandem = s.cfg.drives===2;
  const isSingle = s.cfg.tire==='single';
  const hasTrailer = s.cfg.trailers;
  const needAxle = (axIdx)=> expected.some(t=>t.axle===axIdx);
  const needOuter = (axIdx, side)=>{
    return expected.some(t=>t.axle===axIdx && (isSingle || t.pos==='outer') && t.side===(side==='L'?'L':'R'));
  };
  const needInner = (axIdx, side)=>{
    if(isSingle) return false;
    return expected.some(t=>t.axle===axIdx && t.pos==='inner' && t.side===(side==='L'?'L':'R'));
  };
  function tireCell(axIdx, side, inner){
    const need = inner? needInner(axIdx,side) : needOuter(axIdx,side);
    const cls = need? 'need' : '';
    const txt = need? '⛓️' : '○';
    return '<span class="dt '+cls+'" title="'+(need?'Must chain':'')+'">'+txt+'</span>';
  }
  let html='<div class="axle-diag">';
  html+='<div class="diag-row"><span>Steer</span><div class="diag-axle"><span>○ ○</span></div></div>';
  if(s.cfg.kind==='straight'){
    html+='<div class="diag-row '+(needAxle(0)?'need-row':'')+'"><span>Front Drive</span><div class="diag-axle">'+tireCell(0,'L',true)+tireCell(0,'L',false)+' &nbsp; '+tireCell(0,'R',false)+tireCell(0,'R',true)+'</div></div>';
    html+='<div class="diag-row '+(needAxle(1)?'need-row':'')+'"><span>Rear Drive</span><div class="diag-axle">'+tireCell(1,'L',true)+tireCell(1,'L',false)+' &nbsp; '+tireCell(1,'R',false)+tireCell(1,'R',true)+'</div></div>';
  }else{
    if(isTandem){
      html+='<div class="diag-row '+(needAxle(0)?'need-row':'')+'"><span>Front Drive (primary)</span><div class="diag-axle">'+(isSingle?tireCell(0,'L',false)+' &nbsp; '+tireCell(0,'R',false):tireCell(0,'L',true)+tireCell(0,'L',false)+' &nbsp; '+tireCell(0,'R',false)+tireCell(0,'R',true))+'</div></div>';
      html+='<div class="diag-row '+(needAxle(1)?'need-row':'')+'"><span>Rear Drive</span><div class="diag-axle">'+(isSingle?tireCell(1,'L',false)+' &nbsp; '+tireCell(1,'R',false):tireCell(1,'L',true)+tireCell(1,'L',false)+' &nbsp; '+tireCell(1,'R',false)+tireCell(1,'R',true))+'</div></div>';
    }else{
      html+='<div class="diag-row need-row"><span>Drive (only)</span><div class="diag-axle">'+(isSingle?tireCell(0,'L',false)+' &nbsp; '+tireCell(0,'R',false):tireCell(0,'L',true)+tireCell(0,'L',false)+' &nbsp; '+tireCell(0,'R',false)+tireCell(0,'R',true))+'</div></div>';
    }
  }
  html+='<div class="diag-note">'+s.need+' tires: '+esc(s.note)+'</div>';
  if(s.cfg.trailers===2) html+='<div class="diag-note">BC rule: 6 tires minimum when pulling 2 trailers (4 on front drive + 2 outer rear).</div>';
  if(s.answers.length>1) html+='<div class="diag-note">Alternate legal: '+esc(s.hint)+'</div>';
  html+='</div>';
  return html;
}

  panel.innerHTML='<div class="progress">'+prog+'</div><div class="eyebrow">Results</div><h2>'+score+' of '+SCEN.length+' rigs chained right</h2>'+
  '<p>'+(score===SCEN.length?'Every rig legal. You’re ready for the posted chart at the chain-up area.':'Run it again until every rig is legal on the first try.')+'</p>'+summary+
  '<div class="row"><button class="btn primary" id="b-again">Start over</button><button class="btn" id="b-go">Practice install steps</button><button class="btn" id="b-learn">Review all chainings</button></div>';
  document.getElementById('b-again').onclick=()=>{T.idx=0;T.results=[];T.score=0;T.learnMode='quiz';loadScenario();};
  document.getElementById('b-go').onclick=()=>setMode('install');
  document.getElementById('b-learn').onclick=()=>{T.idx=0;T.learnMode='learn';loadScenario();};
}


/* ---------- Install mode ---------- */

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startInstall(){
  I.done=0;I.mistakes=0;I.fb=null;I.anim=null;
  I.pool=shuffle(STEPS.map(s=>s.id).concat(DISTRACT.map(d=>d.id)));
  instTruck.position.x=0; pivot.rotation.z=0;
  I.glow=0; M.chain.emissive.setHex(0);
  if(homeCam){camera.position.copy(homeCam.p);controls.target.copy(homeCam.t);}
  renderInstall(0); renderInstallPanel(); panel.scrollTop=0;
}
function pick(id){
  if(I.anim) return;
  const exp=STEPS[I.done];
  if(id===exp.id){
    I.done++; I.pool=I.pool.filter(x=>x!==id);
    I.fb={good:true,title:'Correct',text:exp.why};
    if(I.done===8){I.anim={t:0,x0:instTruck.position.x};}
    else{renderInstall(I.done); if(I.done===7) I.glow=1;}
  }else{
    I.mistakes++;
    const d=DISTRACT.find(x=>x.id===id);
    I.fb=d?{good:false,title:'Don’t do that',text:d.why}:{good:false,title:'Not yet',text:exp.hint};
  }
  renderInstallPanel();
}
function modeSwitch(){
  return '<div class="seg" role="tablist"><button class="seg-b" id="m-learn" aria-selected="'+(I.mode==='learn')+'">1. Learn the steps</button><button class="seg-b" id="m-quiz" aria-selected="'+(I.mode==='quiz')+'">2. Test yourself</button></div>';
}
function wireModes(){
  document.getElementById('m-learn').onclick=()=>{I.mode='learn';startInstall();};
  document.getElementById('m-quiz').onclick=()=>{I.mode='quiz';startInstall();};
}
function learnGo(n){
  if(I.anim) return;
  n=Math.max(0,Math.min(8,n));
  instTruck.position.x=0; pivot.rotation.z=0; controls.target.x=DX;
  I.done=n;
  if(n===8){renderInstall(6);I.anim={t:0,x0:0};}
  else{renderInstall(n);if(n===7)I.glow=1;}
  renderInstallPanel();
}
function renderLearn(){
  const k=I.done, cur=k>0?STEPS[k-1]:null;
  const prog=STEPS.map((_,i)=>'<i class="'+(i<k?'ok':'')+'"></i>').join('');
  panel.innerHTML=modeSwitch()+'<div class="progress">'+prog+'</div>'+
    (cur
      ?'<div class="eyebrow">Step '+k+' of 8</div><h2>'+esc(cur.text)+'</h2><p class="why">'+esc(cur.why)+'</p>'
      :'<div class="eyebrow">Learn the steps</div><h2>Putting a chain on the duals</h2><p>You\u2019ve hit a flashing chain-up sign. Press Next to walk through putting one chain on the driver-side front drive duals, one step at a time. Watch the tire change at each step.</p>')+
    '<ol class="steps">'+STEPS.map((st,i)=>'<li class="'+(i<k-1?'ok':i===k-1?'now':'')+'"><span class="n">'+(i+1)+'</span><span>'+esc(st.text)+'</span></li>').join('')+'</ol>'+
    '<div class="row"><button class="btn" id="l-back" '+(k===0?'disabled':'')+'>Back</button>'+
    (k<8?'<button class="btn primary" id="l-next">'+(k===0?'Start':'Next step')+'</button>':'<button class="btn primary" id="l-quiz">Test yourself</button>')+
    '<button class="btn" id="l-reset">Start over</button></div>'+
    '<p class="fine">General practice for steel ladder-style dual chains; follow the maker\u2019s instructions for your chains.</p>';
  wireModes();
  document.getElementById('l-back').onclick=()=>learnGo(k-1);
  const nx=document.getElementById('l-next'); if(nx) nx.onclick=()=>learnGo(k+1);
  const qz=document.getElementById('l-quiz'); if(qz) qz.onclick=()=>{I.mode='quiz';startInstall();};
  document.getElementById('l-reset').onclick=startInstall;
  panel.scrollTop=0;
}
function renderInstallPanel(){
  if(I.mode==='learn') return renderLearn();
  const prog=STEPS.map((_,i)=>'<i class="'+(i<I.done?'ok':i===I.done?'on':'')+'"></i>').join('');
  const all=STEPS.concat(DISTRACT);
  const doneList=STEPS.slice(0,I.done).map(s=>'<li>'+esc(s.text)+'</li>').join('');
  const fb=I.fb?'<div class="fb '+(I.fb.good?'good':'bad')+'"><strong>'+esc(I.fb.title)+'</strong><p>'+esc(I.fb.text)+'</p></div>':'';
  if(I.done>=8){
    panel.innerHTML='<div class="progress">'+prog+'</div><div class="eyebrow">Chained up</div><h2>'+(I.mistakes===0?'Clean install, no mistakes':'Done with '+I.mistakes+' mistake'+(I.mistakes>1?'s':''))+'</h2>'+fb+
    '<ol class="done">'+doneList+'</ol>'+
    '<p>Repeat this on every tire the chart calls for. Removing chains is the reverse: pull into a chain-off area, release the tensioner, unhook outside then inside, and drive off the chain.</p>'+
    '<div class="row"><button class="btn primary" id="b-again">Run it again</button><button class="btn" id="b-go">Which tires quiz</button></div>';
    panel.insertAdjacentHTML('afterbegin',modeSwitch()); wireModes();
    document.getElementById('b-again').onclick=startInstall;
    document.getElementById('b-go').onclick=()=>setMode('tires');
    return;
  }
  const opts=I.pool.map(id=>{const s=all.find(x=>x.id===id);return '<button class="opt" data-id="'+id+'">'+esc(s.text)+'</button>';}).join('');
  panel.innerHTML=modeSwitch()+'<div class="progress">'+prog+'</div><div class="eyebrow">Step '+(I.done+1)+' of 8 · '+I.mistakes+' mistake'+(I.mistakes===1?'':'s')+'</div>'+
    '<h2>Step '+(I.done+1)+': what do you do next?</h2>'+fb+
    (I.done===0?'<p>Pick the steps in the right order from the list below. Some choices are things you should never do.</p>':'')+
    '<ol class="steps">'+STEPS.map((st,i)=>'<li class="'+(i<I.done?'ok':i===I.done?'now':'')+'"><span class="n">'+(i+1)+'</span><span>'+(i<I.done?esc(st.text):i===I.done?'Pick this step below':'')+'</span></li>').join('')+'</ol>'+
    '<div class="opts">'+opts+'</div>'+
    '<div class="row"><button class="btn" id="b-reset">Start over</button></div>'+
    '<p class="fine">General practice for steel ladder-style dual chains; follow the maker’s instructions for your chains.</p>';
  wireModes();
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.id));
  panel.scrollTop=0;
  document.getElementById('b-reset').onclick=startInstall;
}

/* ---------- mode switching ---------- */
function setMode(m){
  mode=m;
  document.getElementById('tab-tires').setAttribute('aria-selected',m==='tires');
  document.getElementById('tab-install').setAttribute('aria-selected',m==='install');
  tip.hidden=true;
  if(m==='tires'){
    inst.visible=false; frontMark.visible=true; sign.position.set(12,0,-8.5);
    chip.textContent='Drag to look around · + / − to zoom · tap a tire to chain it';
    T.idx=0;T.results=[];T.score=0;loadScenario();
  }else{
    if(rig) rig.visible=false; inst.visible=true; frontMark.visible=false; sign.position.set(5,0,-7);
    chip.textContent='Drag to look around · + / − to zoom';
    controls.target.set(DX,0.6,-0.95); camera.position.set(DX+2.7,1.35,-4.5); sun.position.set(18,30,-22); sun.target.position.set(0,0,0); sun.target.updateMatrixWorld(); saveHome();
    startInstall();
  }
}
document.getElementById('tab-tires').onclick=()=>setMode('tires');
document.getElementById('tab-install').onclick=()=>setMode('install');

/* ---------- zoom buttons ---------- */
let homeCam=null;
function saveHome(){homeCam={p:camera.position.clone(),t:controls.target.clone()};}
function zoomBy(f){
  const off=camera.position.clone().sub(controls.target);
  const d=THREE.MathUtils.clamp(off.length()*f,controls.minDistance,controls.maxDistance);
  camera.position.copy(controls.target).add(off.setLength(d));
}
let zHold=null;
function holdZoom(id,f){
  const b=document.getElementById(id);
  const stop=()=>{clearInterval(zHold);zHold=null;};
  b.addEventListener('pointerdown',e=>{e.preventDefault();zoomBy(f);stop();zHold=setInterval(()=>zoomBy(f),120);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoomBy(f);}});
}
holdZoom('z-in',0.8); holdZoom('z-out',1.25);
document.getElementById('z-fit').onclick=()=>{if(homeCam){camera.position.copy(homeCam.p);controls.target.copy(homeCam.t);}};

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let downAt=null, hovered=null;
function hit(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(pickMeshes,false)[0];
  return h?h.object.userData.tire:null;
}
renderer.domElement.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||mode!=='tires'||T.checked) {downAt=null;return;}
  const moved=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y); downAt=null;
  if(moved>6) return;
  const t=hit(e); if(!t) return;
  t.chained=!t.chained; t.chainG.visible=t.chained; renderTires();
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(mode!=='tires'){return;}
  const t=hit(e);
  if(hovered&&hovered!==t&&!T.checked) hovered.mat.emissive.setHex(0);
  hovered=t;
  if(t){
    if(!T.checked) t.mat.emissive.setHex(0x3a3a3a);
    const r=stage.getBoundingClientRect();
    tip.textContent=tireLabel(t); tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.hidden=false;
    renderer.domElement.style.cursor=T.checked?'default':'pointer';
  }else{tip.hidden=true;renderer.domElement.style.cursor='';}
});
renderer.domElement.addEventListener('pointerleave',()=>{tip.hidden=true;});

/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(!reduce){
    const p=flakeGeo.attributes.position.array;
    for(let i=0;i<flakeN;i++){p[i*3+1]-=dt*(1.2+(i%5)*0.15);p[i*3]+=Math.sin(now*0.0006+i)*dt*0.3;if(p[i*3+1]<0)p[i*3+1]=22;}
    flakeGeo.attributes.position.needsUpdate=true;
  }
  const on=Math.floor(now/450)%2===0;
  sign.children.forEach(c=>{if(c.userData.flash)c.material.color.setHex(on?0xffb000:0x3a2a00);});
  if(I.glow>0){I.glow-=dt*0.6;M.chain.emissive.setRGB(0.25*Math.max(I.glow,0),0.6*Math.max(I.glow,0),0.4*Math.max(I.glow,0));if(I.glow<=0)M.chain.emissive.setHex(0);}
  if(I.anim){
    I.anim.t+=dt/2.4; const k=Math.min(I.anim.t,1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const dist=1.6; instTruck.position.x=I.anim.x0+dist*e; pivot.rotation.z=-(dist*e)/R;
    controls.target.x=DX+instTruck.position.x;
    if(k>=1){I.anim=null;I.glow=1;}
  }
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
function start(){setMode('tires');requestAnimationFrame(tick);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
